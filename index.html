<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto</title>
</head>

<body>

    <!-- O container garante o limite de largura e centralização do CSS -->
    <main class="container">
        <h1>Validador de Elegibilidade (CNH)</h1>

        <section id="forUser">
            <form class="formulario" id="formulario" novalidate>
                <!-- Nome -->
                <div class="row mb-3 align-items-center">
                    <label for="inputName3" class="col-sm-3 col-form-label">Nome</label>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" id="name" placeholder="Ex.: João da Silva"
                            required minlength="3">
                    </div>
                </div>

                <!-- Email -->
                <div class="row mb-3 align-items-center">
                    <label for="inputEmail3" class="col-sm-3 col-form-label">Email</label>
                    <div class="col-sm-9">
                        <input type="email" class="form-control" id="email" placeholder="seu@email.com" required> 
                    </div>
                </div>

                <!-- Senha -->
                <div class="row mb-3 align-items-center">
                    <label for="inputPassword3" class="col-sm-3 col-form-label">Senha</label>
                    <div class="col-sm-9">
                        <input type="password" class="form-control" id="password" required
                            placeholder="Mínimo 6 caracteres" minlength="6">
                    </div>
                </div>

                <!-- Nascimento -->
                <div class="row mb-3 align-items-center">
                    <label for="inputYear" class="col-sm-3 col-form-label">Nascimento</label>
                    <div class="col-sm-9">
                        <input type="number" class="form-control" id="birthYear" required placeholder="Ex.: 1997">
                    </div>
                </div>

                <button type="submit" class="theme-btn" onclick="verificarIdade()">Verificar</button>
            </form>
        </section>

        <!-- Card de resposta colocado logo abaixo do formulário -->
        <div id="cardOculto" class="card-oculto hidden">
            <div id="card">
                <h3 id="tittle"></h3>
                <h2 id="subTittle"></h2>
                <p id="par"></p>

                <div id="alertCNH" class="alert mt-4 fs-5" role="alert"></div>
            </div>

            <button type="button" id="btnVoltar" class="theme-btn" onclick="voltar()">Voltar</button>
        </div>
    </main>

    <script src="./script.js"></script>
</body>
</html>
